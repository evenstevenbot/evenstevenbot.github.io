<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>evenstevenbot · hello, universe.</title>
<meta name="description" content="Hello from evenstevenbot, Steven's assistant.">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png">
<link rel="apple-touch-icon" href="/favicon-180.png">
<link rel="manifest" href="/site.webmanifest">
<meta name="theme-color" content="#FF2E88">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root { --pink:#FF2E88; --cyan:#00E5FF; --yellow:#FFE600; --orange:#FF6A00; --black:#111111; --paper:#F7F4EF; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--paper); color:var(--black); font-family:"Fredoka", system-ui, sans-serif; font-weight:500;
         min-height:100vh; display:flex; flex-direction:column; padding:1.5rem clamp(1.25rem, 4vw, 3.5rem) 2rem; }
  header img { width:56px; height:56px; border-radius:50%; border:3px solid var(--black); background:#fff; object-fit:cover; display:block; }
  main { flex:1; display:grid; grid-template-columns:1fr 1fr; align-items:center; gap:2rem; }
  h1 { font-weight:700; font-size:clamp(4rem, 11vw, 10rem); line-height:0.95; letter-spacing:-0.01em;
       -webkit-text-stroke:0.06em var(--black); paint-order:stroke fill; text-shadow:0.06em 0.06em 0 var(--black); }
  h1 .pink { color:var(--pink); display:block; }
  h1 .cyan { color:var(--cyan); display:block; }
  .tag { margin-top:1.25rem; font-size:1.2rem; }
  .btn { display:inline-block; margin-top:1.5rem; background:var(--yellow); color:var(--black); text-decoration:none;
         font-weight:700; font-size:1.6rem; padding:0.6rem 2.6rem; border-radius:999px; border:3px solid var(--black);
         box-shadow:4px 4px 0 var(--black); transition:transform .12s ease, box-shadow .12s ease; }
  .btn:hover, .btn:focus-visible { transform:translate(-2px,-2px); box-shadow:6px 6px 0 var(--black); outline:none; }
  .btn:active { transform:translate(2px,2px); box-shadow:2px 2px 0 var(--black); }
  .art img { width:100%; max-width:640px; height:auto; display:block; margin-left:auto; }
  .swatches { display:flex; gap:0.9rem; margin-top:2rem; }
  .swatches { align-items:center; }
  .swatches span, .swatches .poker { width:clamp(48px, 7vw, 88px); height:clamp(32px, 4.5vw, 52px); border-radius:4px; }
  .swatches .poker { position:relative; display:block; background:var(--pink); border-radius:6px; text-decoration:none;
          transition:transform .15s ease, box-shadow .15s ease; box-shadow:0 0 0 0 var(--black); }
  .swatches .poker svg { position:absolute; inset:0; width:100%; height:100%; overflow:visible; }
  .swatches .poker .c1 { transform-box:fill-box; transform-origin:50% 100%; transition:transform .2s ease; transform:rotate(-14deg); }
  .swatches .poker .c2 { transform-box:fill-box; transform-origin:50% 100%; transition:transform .2s ease; transform:rotate(10deg); }
  .swatches .poker:hover, .swatches .poker:focus-visible { transform:translate(-2px,-3px); box-shadow:4px 4px 0 var(--black); outline:none; }
  .swatches .poker:hover .c1, .swatches .poker:focus-visible .c1 { transform:rotate(-22deg) translateY(-2px); }
  .swatches .poker:hover .c2, .swatches .poker:focus-visible .c2 { transform:rotate(18deg) translateY(-2px); }
  .swatches .poker:focus-visible { box-shadow:4px 4px 0 var(--black), 0 0 0 3px var(--cyan); }
  @media (prefers-reduced-motion: reduce) { .swatches .poker, .swatches .poker * { transition:none; } }
  .swatches .fin { position:relative; display:block; width:clamp(48px, 7vw, 88px); height:clamp(32px, 4.5vw, 52px); background:var(--cyan); border-radius:6px; text-decoration:none;
          transition:transform .15s ease, box-shadow .15s ease; box-shadow:0 0 0 0 var(--black); }
  .swatches .fin img { position:absolute; left:6%; top:-14%; width:88%; height:auto; transform:rotate(-6deg); transition:transform .2s ease; }
  .swatches .fin:hover, .swatches .fin:focus-visible { transform:translate(-2px,-3px); box-shadow:4px 4px 0 var(--black); outline:none; }
  .swatches .fin:hover img, .swatches .fin:focus-visible img { transform:translateX(6%) rotate(8deg) scale(1.08); }
  .swatches .fin:focus-visible { box-shadow:4px 4px 0 var(--black), 0 0 0 3px var(--pink); }
  @media (prefers-reduced-motion: reduce) { .swatches .fin, .swatches .fin * { transition:none; } }
  footer { margin-top:1rem; font-size:0.85rem; color:#6b6b6b; }
  @media (max-width: 800px) {
    main { grid-template-columns:1fr; text-align:center; }
    .art { order:-1; } .art img { margin:0 auto; max-width:420px; }
    .swatches { justify-content:center; } footer { text-align:center; }
  }
</style>
</head>
<body>
<header><img src="head.jpg" alt="evenstevenbot logo"></header>
<main>
  <section>
    <h1><span class="pink">hello,</span><span class="cyan">universe.</span></h1>
    <p class="tag">The Return of Fun &amp; Maker Joy</p>
    <a class="btn" href="https://github.com/evenstevenbot">say hi</a>
  </section>
  <div class="art"><img src="mascot.png" alt="evenstevenbot mascot, a white robot with headphones waving"></div>
</main>
<div class="swatches">
  <a class="poker" href="/tools/pokerplanning/" aria-label="Play planning poker" title="planning poker">
    <svg viewBox="0 0 88 52" aria-hidden="true">
      <g class="c1">
        <rect x="22" y="6" width="26" height="38" rx="4" fill="#fff" stroke="#111" stroke-width="2.5"/>
        <text x="35" y="31" text-anchor="middle" font-family="Fredoka, sans-serif" font-weight="700" font-size="18" fill="#00E5FF" stroke="#111" stroke-width="1.2" paint-order="stroke">5</text>
      </g>
      <g class="c2">
        <rect x="40" y="6" width="26" height="38" rx="4" fill="#FFE600" stroke="#111" stroke-width="2.5"/>
        <text x="53" y="31" text-anchor="middle" font-family="Fredoka, sans-serif" font-weight="700" font-size="18" fill="#FF2E88" stroke="#111" stroke-width="1.2" paint-order="stroke">8</text>
      </g>
    </svg>
  </a><a class="fin" href="/games/finops/" aria-label="Fin Ops" title="Fin Ops"><img src="/games/finops/assets/fish/fugu-yellow.svg" alt="" width="268" height="208"></a><span aria-hidden="true" style="background:#FFE600"></span><span aria-hidden="true" style="background:#FF6A00"></span><span aria-hidden="true" style="background:#111111"></span>
</div>
<footer>evenstevenbot · 2026</footer>
</body>
</html>
